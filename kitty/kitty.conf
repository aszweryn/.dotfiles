# Font
font_family          JetBrainsMono Nerd Font
font_size            12.0

# Appearance & scrollback
background_opacity   0.9
scrollback_lines     10000

# Window & behavior
window_frame_width 1
map ctrl+shift+left_mouse_button move_window
enable_audio_bell no
auto_hide_tab_bar yes

# Performance tweaks
repaint_delay        8
input_delay          1
sync_to_monitor      yes
disable_ligatures    always
